name: Real-LLM E2E (scheduled)

# 真机大模型 e2e 定时门（评审建议落地，2026-08-16）。
# 不在 push/PR 门内：真实模型调用消耗配额且对端点可用性敏感，按天验证回归。
# 前置：仓库 Secrets 配置 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL
# （模型必须在端点支持流式——claude.jlcops.com 的 deepseek-v4-pro 曾流式空体）。
# 手动触发：workflow_dispatch。

on:
  schedule:
    # 每天 02:00 UTC（北京 10:00）——避开工作时段峰值。
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  real-llm-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      RUN_LLM_E2E: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build protocol packages (dist 前置)
        run: npm run build:protocol

      - name: Run real-model e2e suite (tracer + full matrix)
        run: |
          node --import tsx --import ./src/tui/preload-env.ts \
            --test --test-concurrency=1 \
            tests/e2e/tui-client-tracer.real-llm.test.ts \
            tests/e2e/tui-client-full-matrix.real-llm.test.ts

      - name: Upload candidate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-logs
          path: |
            **/candidate-logs/
          retention-days: 7
