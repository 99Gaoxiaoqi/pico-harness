<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="944" viewBox="0 0 1200 944" role="img" aria-label="记忆写入：证据先行，分阶段处理"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="944" rx="24" fill="#f6f8fc"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="48" y="40" font-size="13" fill="#64748b" font-weight="600">PICO  /  MEMORY ENGINEERING</text><text x="48" y="88" font-size="32" fill="#13283e" font-weight="600">记忆写入：证据先行，分阶段处理</text><text x="48" y="121" font-size="17" fill="#526277" font-weight="400">成功主路径通常包含两次辅助模型调用；一次受限历史定位和重试共享每段调用额度。</text><rect x="48" y="158" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="68" y="183" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="68" y="215" font-size="21" fill="#172f49" font-weight="600">1  冻结来源快照</text><text x="68" y="243" font-size="16" fill="#47586d" font-weight="400">工作区、会话、消息边界</text><text x="68" y="267" font-size="16" fill="#47586d" font-weight="400">事件索引、请求内容、删除代次</text><rect x="432" y="158" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="452" y="183" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="452" y="215" font-size="21" fill="#172f49" font-weight="600">2  准入与范围调度</text><text x="452" y="243" font-size="16" fill="#47586d" font-weight="400">按实际触发类型检查开关</text><text x="452" y="267" font-size="16" fill="#47586d" font-weight="400">失败范围 → checkpoint → 当前范围</text><rect x="816" y="158" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="836" y="183" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="836" y="215" font-size="21" fill="#172f49" font-weight="600">3  建立用户证据</text><text x="836" y="243" font-size="16" fill="#47586d" font-weight="400">真实用户消息＋来源索引</text><text x="836" y="267" font-size="16" fill="#47586d" font-weight="400">工具结果与助手断言不作证据</text><rect x="816" y="362" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="836" y="387" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="836" y="419" font-size="21" fill="#172f49" font-weight="600">4  检查完整请求预算</text><text x="836" y="447" font-size="16" fill="#47586d" font-weight="400">必要时沿完整轮次拆成两段</text><text x="836" y="471" font-size="16" fill="#47586d" font-weight="400">两段都需满足预算，不递归拆分</text><rect x="432" y="362" width="336" height="130" rx="14" fill="#eaf2ff" stroke="#8ab5f4" stroke-width="1.5"/><text x="452" y="387" font-size="12" fill="#64748b" font-weight="600">大模型</text><text x="452" y="419" font-size="21" fill="#172f49" font-weight="600">5  提取候选与分类</text><text x="452" y="447" font-size="16" fill="#47586d" font-weight="400">生成正文、类型、范围、关键词</text><text x="452" y="471" font-size="16" fill="#47586d" font-weight="400">引用来源事件与用户原话</text><rect x="48" y="362" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="68" y="387" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="68" y="419" font-size="21" fill="#172f49" font-weight="600">6  检查候选与引文</text><text x="68" y="447" font-size="16" fill="#47586d" font-weight="400">校验 JSON、枚举、时间与来源</text><text x="68" y="471" font-size="16" fill="#47586d" font-weight="400">需要时进行一次受限历史定位</text><rect x="48" y="566" width="336" height="130" rx="14" fill="#eaf2ff" stroke="#8ab5f4" stroke-width="1.5"/><text x="68" y="591" font-size="12" fill="#64748b" font-weight="600">大模型</text><text x="68" y="623" font-size="21" fill="#172f49" font-weight="600">7  依据证据重新规范化</text><text x="68" y="651" font-size="16" fill="#47586d" font-weight="400">只传候选 ID、引文及必要语境</text><text x="68" y="675" font-size="16" fill="#47586d" font-weight="400">不传前次候选正文、keys 或 scope</text><rect x="432" y="566" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="452" y="591" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="452" y="623" font-size="21" fill="#172f49" font-weight="600">8  再次验证与准入复核</text><text x="452" y="651" font-size="16" fill="#47586d" font-weight="400">检查规范化结果与敏感信息</text><text x="452" y="675" font-size="16" fill="#47586d" font-weight="400">复核实时开关和删除代次</text><rect x="816" y="566" width="336" height="130" rx="14" fill="#e7f5ef" stroke="#81bba4" stroke-width="1.5"/><text x="836" y="591" font-size="12" fill="#64748b" font-weight="600">持久化</text><text x="836" y="623" font-size="21" fill="#172f49" font-weight="600">9  事务提交并返回结果</text><text x="836" y="651" font-size="16" fill="#47586d" font-weight="400">条目、关键词、来源一并保存</text><text x="836" y="675" font-size="16" fill="#47586d" font-weight="400">同步推进进度、记录操作回执</text><path d="M 384 223 H 432" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="432.0,223.0 422.0,218.0 422.0,228.0" fill="#64748b"/><path d="M 768 223 H 816" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="816.0,223.0 806.0,218.0 806.0,228.0" fill="#64748b"/><path d="M 984 288 V 362" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="984.0,362.0 979.0,352.0 989.0,352.0" fill="#64748b"/><path d="M 816 427 H 768" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="768.0,427.0 778.0,422.0 778.0,432.0" fill="#64748b"/><path d="M 432 427 H 384" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="384.0,427.0 394.0,422.0 394.0,432.0" fill="#64748b"/><path d="M 216 492 V 566" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="216.0,566.0 211.0,556.0 221.0,556.0" fill="#64748b"/><path d="M 384 631 H 432" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="432.0,631.0 422.0,626.0 422.0,636.0" fill="#64748b"/><path d="M 768 631 H 816" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="816.0,631.0 806.0,626.0 806.0,636.0" fill="#64748b"/><rect x="48" y="743" width="1104" height="120" rx="12" fill="#edf1f7"/><text x="68" y="770" font-size="16" fill="#23384f" font-weight="600">失败、空结果与恢复</text><text x="68" y="796" font-size="15" fill="#526277" font-weight="400">没有合法候选：空提交处理进度，不新增记忆。每段最多 3 次模型调用，单次期限 60 秒。</text><text x="68" y="820" font-size="15" fill="#526277" font-weight="400">失败范围：后续不同操作触发时重试，再次失败可跳过；临时不可用不作为证据处理失败。</text><text x="68" y="844" font-size="15" fill="#526277" font-weight="400">已拒绝的自动提取范围不会因后续显式“记住”被放行；提交前删除代次变化会使旧任务失效。</text><text x="48" y="921" font-size="13" fill="#64748b" font-weight="400">蓝色：模型判断    白色：程序处理    绿色：持久化数据    ·    实现基线 4b64eabd</text></g></svg>