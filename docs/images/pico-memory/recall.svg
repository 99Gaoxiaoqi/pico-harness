<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="记忆召回：确定性的关键词检索"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="750" rx="24" fill="#f6f8fc"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="48" y="40" font-size="13" fill="#64748b" font-weight="600">PICO  /  MEMORY ENGINEERING</text><text x="48" y="88" font-size="32" fill="#13283e" font-weight="600">记忆召回：确定性的关键词检索</text><text x="48" y="121" font-size="17" fill="#526277" font-weight="400">大模型负责最终回答；查询词构造、检索、过滤与排序由本地程序完成。</text><rect x="48" y="158" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="68" y="183" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="68" y="215" font-size="21" fill="#172f49" font-weight="600">1  查询与准入</text><text x="68" y="243" font-size="16" fill="#47586d" font-weight="400">当前用户问题</text><text x="68" y="267" font-size="16" fill="#47586d" font-weight="400">运行路径、信任、总开关与召回开关</text><rect x="432" y="158" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="452" y="183" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="452" y="215" font-size="21" fill="#172f49" font-weight="600">2  构造检索信号</text><text x="452" y="243" font-size="16" fill="#47586d" font-weight="400">关键词、路径、中文双字词项</text><text x="452" y="267" font-size="16" fill="#47586d" font-weight="400">去重与停用词过滤，最多 32 个词项</text><rect x="816" y="158" width="336" height="130" rx="14" fill="#e7f5ef" stroke="#81bba4" stroke-width="1.5"/><text x="836" y="183" font-size="12" fill="#64748b" font-weight="600">持久化</text><text x="836" y="215" font-size="21" fill="#172f49" font-weight="600">3  并行获取候选</text><text x="836" y="243" font-size="16" fill="#47586d" font-weight="400">精确／前缀匹配各最多 100 条</text><text x="836" y="267" font-size="16" fill="#47586d" font-weight="400">最近 500 条内补充中文复合词匹配</text><path d="M 384 223 H 432" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="432.0,223.0 422.0,218.0 422.0,228.0" fill="#64748b"/><path d="M 768 223 H 816" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="816.0,223.0 806.0,218.0 806.0,228.0" fill="#64748b"/><path d="M 984 288 V 380" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="984.0,380.0 979.0,370.0 989.0,370.0" fill="#64748b"/><rect x="816" y="380" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="836" y="405" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="836" y="437" font-size="21" fill="#172f49" font-weight="600">4  范围过滤与排序</text><text x="836" y="465" font-size="16" fill="#47586d" font-weight="400">仅 active，全局＋当前工作区</text><text x="836" y="489" font-size="16" fill="#47586d" font-weight="400">去重、相关性排序、同分取最近</text><rect x="432" y="380" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="452" y="405" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="452" y="437" font-size="21" fill="#172f49" font-weight="600">5  选择与安全包装</text><text x="452" y="465" font-size="16" fill="#47586d" font-weight="400">可补充一条未匹配的通用偏好</text><text x="452" y="489" font-size="16" fill="#47586d" font-weight="400">最多 3 条／320 token，含 XML 包装</text><rect x="48" y="380" width="336" height="130" rx="14" fill="#eaf2ff" stroke="#8ab5f4" stroke-width="1.5"/><text x="68" y="405" font-size="12" fill="#64748b" font-weight="600">大模型</text><text x="68" y="437" font-size="21" fill="#172f49" font-weight="600">6  注入上下文并回答</text><text x="68" y="465" font-size="16" fill="#47586d" font-weight="400">主模型按相关性使用记忆内容</text><text x="68" y="489" font-size="16" fill="#47586d" font-weight="400">当前指令与权限规则仍然优先</text><path d="M 816 445 H 768" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="768.0,445.0 778.0,440.0 778.0,450.0" fill="#64748b"/><path d="M 432 445 H 384" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="384.0,445.0 394.0,440.0 394.0,450.0" fill="#64748b"/><rect x="48" y="552" width="1104" height="96" rx="12" fill="#edf1f7"/><text x="68" y="579" font-size="16" fill="#23384f" font-weight="600">召回的边界</text><text x="68" y="605" font-size="15" fill="#526277" font-weight="400">单条放不下就跳过；无可用结果、召回关闭或查询失败时，不注入记忆，普通对话继续。</text><text x="68" y="629" font-size="15" fill="#526277" font-weight="400">关键词匹配依赖措辞与索引词项；当前没有语义向量检索，也没有自动化的语义冲突裁决。</text><text x="48" y="727" font-size="13" fill="#64748b" font-weight="400">蓝色：模型判断    白色：程序处理    绿色：持久化数据    ·    实现基线 4b64eabd</text></g></svg>