<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="从一次对话，到下一次仍可使用的记忆"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1200" height="750" rx="24" fill="#f6f8fc"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="48" y="40" font-size="13" fill="#64748b" font-weight="600">PICO  /  MEMORY ENGINEERING</text><text x="48" y="88" font-size="32" fill="#13283e" font-weight="600">从一次对话，到下一次仍可使用的记忆</text><text x="48" y="121" font-size="17" fill="#526277" font-weight="400">会话事件提供证据，长期记忆独立保存，召回结果作为回答参考。</text><rect x="48" y="162" width="336" height="130" rx="14" fill="#e7f5ef" stroke="#81bba4" stroke-width="1.5"/><text x="68" y="187" font-size="12" fill="#64748b" font-weight="600">持久化</text><text x="68" y="219" font-size="21" fill="#172f49" font-weight="600">1  用户对话与历史事件</text><text x="68" y="247" font-size="16" fill="#47586d" font-weight="400">RuntimeEvent 保留原始过程</text><text x="68" y="271" font-size="16" fill="#47586d" font-weight="400">模型历史是事件的读取投影</text><rect x="432" y="162" width="336" height="130" rx="14" fill="#eaf2ff" stroke="#8ab5f4" stroke-width="1.5"/><text x="452" y="187" font-size="12" fill="#64748b" font-weight="600">大模型</text><text x="452" y="219" font-size="21" fill="#172f49" font-weight="600">2  提取与独立规范化</text><text x="452" y="247" font-size="16" fill="#47586d" font-weight="400">明确记住／完成后提取／自动压缩</text><text x="452" y="271" font-size="16" fill="#47586d" font-weight="400">模型整理，程序校验用户证据</text><rect x="816" y="162" width="336" height="130" rx="14" fill="#e7f5ef" stroke="#81bba4" stroke-width="1.5"/><text x="836" y="187" font-size="12" fill="#64748b" font-weight="600">持久化</text><text x="836" y="219" font-size="21" fill="#172f49" font-weight="600">3  原子长期记忆库</text><text x="836" y="247" font-size="16" fill="#47586d" font-weight="400">memory.sqlite</text><text x="836" y="271" font-size="16" fill="#47586d" font-weight="400">条目、关键词、来源与处理进度</text><path d="M 384 227 H 432" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="432.0,227.0 422.0,222.0 422.0,232.0" fill="#64748b"/><path d="M 768 227 H 816" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="816.0,227.0 806.0,222.0 806.0,232.0" fill="#64748b"/><rect x="816" y="390" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="836" y="415" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="836" y="447" font-size="21" fill="#172f49" font-weight="600">4  关键词与范围检索</text><text x="836" y="475" font-size="16" fill="#47586d" font-weight="400">全局＋当前工作区的有效记忆</text><text x="836" y="499" font-size="16" fill="#47586d" font-weight="400">当前没有 embedding 或向量检索</text><rect x="432" y="390" width="336" height="130" rx="14" fill="#ffffff" stroke="#c8d3e1" stroke-width="1.5"/><text x="452" y="415" font-size="12" fill="#64748b" font-weight="600">程序</text><text x="452" y="447" font-size="21" fill="#172f49" font-weight="600">5  相关性排序与预算筛选</text><text x="452" y="475" font-size="16" fill="#47586d" font-weight="400">最多 3 条，总计 320 token</text><text x="452" y="499" font-size="16" fill="#47586d" font-weight="400">作为低信任参考加入上下文</text><rect x="48" y="390" width="336" height="130" rx="14" fill="#eaf2ff" stroke="#8ab5f4" stroke-width="1.5"/><text x="68" y="415" font-size="12" fill="#64748b" font-weight="600">大模型</text><text x="68" y="447" font-size="21" fill="#172f49" font-weight="600">6  主模型回答新问题</text><text x="68" y="475" font-size="16" fill="#47586d" font-weight="400">结合当前问题与召回信息</text><text x="68" y="499" font-size="16" fill="#47586d" font-weight="400">记忆不能授予工具权限</text><path d="M 984 292 V 390" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="984.0,390.0 979.0,380.0 989.0,380.0" fill="#64748b"/><text x="1005" y="343" font-size="14" fill="#526277" font-weight="400">后续问题触发召回</text><path d="M 816 455 H 768" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="768.0,455.0 778.0,450.0 778.0,460.0" fill="#64748b"/><path d="M 432 455 H 384" fill="none" stroke="#64748b" stroke-width="2"/><polygon points="384.0,455.0 394.0,450.0 394.0,460.0" fill="#64748b"/><rect x="48" y="561" width="1104" height="96" rx="12" fill="#edf1f7"/><text x="68" y="588" font-size="16" fill="#23384f" font-weight="600">两个独立入口</text><text x="68" y="614" font-size="15" fill="#526277" font-weight="400">App 手动添加：本地校验后直接写入当前工作区笔记，不调用提取模型。</text><text x="68" y="638" font-size="15" fill="#526277" font-weight="400">上下文压缩：保存摘要及覆盖边界；只有符合条件的自动压缩边界进入记忆提取。</text><text x="48" y="727" font-size="13" fill="#64748b" font-weight="400">蓝色：模型判断    白色：程序处理    绿色：持久化数据    ·    实现基线 4b64eabd</text></g></svg>