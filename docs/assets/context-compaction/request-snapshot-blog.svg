<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#F8FAFC"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="64" y="55" font-size="16" fill="#62748A" font-weight="600">PICO ENGINEERING  /  CONTEXT OBSERVABILITY</text><text x="64" y="112" font-size="38" fill="#172B42" font-weight="700">同一个会话，三个不同口径</text><text x="64" y="152" font-size="21" fill="#62748A" font-weight="400">最近请求记录已经发生的事实；当前历史反映压缩后的模型视图。</text><rect x="64" y="200" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#D8E1EA"/><rect x="80" y="217" width="312" height="42" rx="14" fill="#EDF3FF" stroke="#EDF3FF"/><text x="94" y="245" font-size="23" fill="#3269D6" font-weight="600">最近成功主请求</text><text x="88" y="294" font-size="17" fill="#62748A" font-weight="400">过去一次请求 · 真实上报</text><text x="88" y="338" font-size="22" fill="#3269D6" font-weight="600">实际输入 I ／ 当次窗口</text><text x="88" y="390" font-size="17" fill="#172B42" font-weight="400">缓存属于输入子集，不重复累加</text><text x="88" y="424" font-size="17" fill="#172B42" font-weight="400">路由、窗口、组成、压缩边界</text><text x="88" y="458" font-size="17" fill="#172B42" font-weight="400">与 canonical 请求同事务保存</text><rect x="428" y="200" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#D8E1EA"/><rect x="444" y="217" width="312" height="42" rx="14" fill="#EAF7F1" stroke="#EAF7F1"/><text x="458" y="245" font-size="23" fill="#168579" font-weight="600">当前模型历史</text><text x="452" y="294" font-size="17" fill="#62748A" font-weight="400">此刻的投影 · chars_v1</text><text x="452" y="338" font-size="22" fill="#168579" font-weight="600">≈ 有效字符 ÷ 4 + 媒体</text><text x="452" y="390" font-size="17" fill="#172B42" font-weight="400">消息条数和 checkpoint 是事实</text><text x="452" y="424" font-size="17" fill="#172B42" font-weight="400">Token 数为本地估算</text><text x="452" y="458" font-size="17" fill="#172B42" font-weight="400">不等于完整下一次模型输入</text><rect x="792" y="200" width="344" height="300" rx="14" fill="#FFFFFF" stroke="#D8E1EA"/><rect x="808" y="217" width="312" height="42" rx="14" fill="#F4EFFA" stroke="#F4EFFA"/><text x="822" y="245" font-size="23" fill="#8A60BB" font-weight="600">会话累计用量</text><text x="816" y="294" font-size="17" fill="#62748A" font-weight="400">全部物理请求 · 累计</text><text x="816" y="338" font-size="22" fill="#8A60BB" font-weight="600">Σ 已上报的请求用量</text><text x="816" y="390" font-size="17" fill="#172B42" font-weight="400">包含历史步骤的累计消耗</text><text x="816" y="424" font-size="17" fill="#172B42" font-weight="400">压缩不会清零已经发生的用量</text><text x="816" y="458" font-size="17" fill="#172B42" font-weight="400">不能拿它除以上下文窗口</text><rect x="64" y="533" width="1072" height="95" rx="14" fill="#EAF0F6" stroke="#EAF0F6"/><text x="87" y="570" font-size="21" fill="#172B42" font-weight="600">请求组成另按字节展示：≈ ceil(UTF-8 bytes / 4)</text><text x="87" y="608" font-size="18" fill="#62748A" font-weight="400">手动压缩只更新当前历史；下一次主请求成功后，请求快照才整体更新。</text><text x="64" y="690" font-size="15" fill="#62748A" font-weight="400">Pico Harness · 上下文压缩技术详解</text><text x="1006" y="690" font-size="15" fill="#62748A" font-weight="400">技术原理图</text></g></svg>