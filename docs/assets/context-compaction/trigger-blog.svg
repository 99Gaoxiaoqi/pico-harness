<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#3269D6"/></marker></defs><rect width="1200" height="720" fill="#F8FAFC"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="64" y="55" font-size="16" fill="#62748A" font-weight="600">PICO ENGINEERING  /  CONTEXT COMPACTION</text><text x="64" y="112" font-size="38" fill="#172B42" font-weight="700">什么时候自动压缩？</text><text x="64" y="152" font-size="21" fill="#62748A" font-weight="400">同次发送共享一次机会；成功模型步骤不会重置尝试标记。</text><text x="1100" y="65" font-size="24" fill="#3269D6" font-weight="700">02</text><rect x="64" y="193" width="1072" height="88" rx="12" fill="#EDF3FF" stroke="#D1DFFA"/><text x="89" y="228" font-size="17" fill="#3269D6" font-weight="700">触发公式</text><text x="89" y="263" font-size="23" fill="#172B42" font-weight="600">inputTokens + outputTokens + min(2 × outputTokens, 8000) ≥ 显式上下文窗口</text><rect x="64" y="328" width="232" height="136" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><text x="84" y="362" font-size="19" fill="#3269D6" font-weight="700">1</text><text x="84" y="400" font-size="26" fill="#172B42" font-weight="600">检查用量</text><text x="84" y="437" font-size="18" fill="#62748A" font-weight="400">同路线实际 I 与 O</text><path d="M304 396 L334 396" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><rect x="344" y="328" width="232" height="136" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><text x="364" y="362" font-size="19" fill="#3269D6" font-weight="700">2</text><text x="364" y="400" font-size="26" fill="#172B42" font-weight="600">消耗尝试机会</text><text x="364" y="437" font-size="18" fill="#62748A" font-weight="400">再选择安全前缀</text><path d="M584 396 L614 396" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><rect x="624" y="328" width="232" height="136" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><text x="644" y="362" font-size="19" fill="#3269D6" font-weight="700">3</text><text x="644" y="400" font-size="26" fill="#172B42" font-weight="600">生成摘要</text><text x="644" y="437" font-size="18" fill="#62748A" font-weight="400">校验必要章节</text><path d="M864 396 L894 396" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><rect x="904" y="328" width="232" height="136" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><text x="924" y="362" font-size="19" fill="#3269D6" font-weight="700">4</text><text x="924" y="400" font-size="26" fill="#172B42" font-weight="600">提交检查点</text><text x="924" y="437" font-size="18" fill="#62748A" font-weight="400">重建模型上下文</text><rect x="64" y="514" width="512" height="111" rx="12" fill="#F0F5FA" stroke="#DEE7EF"/><text x="86" y="552" font-size="22" fill="#172B42" font-weight="600">未达到阈值</text><text x="86" y="590" font-size="19" fill="#62748A" font-weight="400">继续正常模型请求，不调用摘要模型。</text><rect x="600" y="514" width="536" height="111" rx="12" fill="#FFF5E9" stroke="#EDDDC8"/><text x="622" y="552" font-size="22" fill="#172B42" font-weight="600">无安全切点 / 摘要失败</text><text x="622" y="590" font-size="19" fill="#62748A" font-weight="400">保留历史，本次发送不再尝试摘要恢复。</text><path d="M64 664 H1136" stroke="#D8E1EA"/><text x="64" y="694" font-size="15" fill="#62748A" font-weight="400">Pico Harness · 上下文压缩技术详解</text><text x="996" y="694" font-size="15" fill="#62748A" font-weight="400">技术原理图</text></g></svg>