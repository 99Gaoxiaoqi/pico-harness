<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#3269D6"/></marker></defs><rect width="1200" height="720" fill="#F8FAFC"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="64" y="55" font-size="16" fill="#62748A" font-weight="600">PICO ENGINEERING  /  CONTEXT COMPACTION</text><text x="64" y="112" font-size="38" fill="#172B42" font-weight="700">两种压缩，处理两种增长</text><text x="64" y="152" font-size="21" fill="#62748A" font-weight="400">工具结果先缩成预览；累积历史再整理成工作记忆。</text><text x="1100" y="65" font-size="24" fill="#3269D6" font-weight="700">01</text><rect x="64" y="208" width="1072" height="158" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><rect x="85" y="232" width="42" height="42" rx="10" fill="#3269D6" stroke="#3269D6"/><text x="96" y="261" font-size="24" fill="#FFF" font-weight="700">A</text><text x="147" y="257" font-size="25" fill="#172B42" font-weight="600">工具结果归档投影</text><text x="147" y="292" font-size="17" fill="#62748A" font-weight="400">确定性处理 · 无需摘要模型</text><path d="M440 287 L498 287" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="235" width="218" height="106" rx="10" fill="#F0F5FF" stroke="#C9D9F7"/><text x="544" y="273" font-size="20" fill="#3269D6" font-weight="600">短预览 + 归档 URI</text><text x="544" y="309" font-size="17" fill="#62748A" font-weight="400">细节需要时再回读</text><path d="M760 287 L810 287" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><text x="839" y="272" font-size="22" fill="#172B42" font-weight="600">控制单次大输出</text><text x="839" y="306" font-size="16" fill="#62748A" font-weight="400">避免工具全文反复进入上下文</text><rect x="64" y="394" width="1072" height="158" rx="16" fill="#FFFFFF" stroke="#D8E1EA"/><rect x="85" y="418" width="42" height="42" rx="10" fill="#168579" stroke="#168579"/><text x="96" y="447" font-size="24" fill="#FFF" font-weight="700">B</text><text x="147" y="443" font-size="25" fill="#172B42" font-weight="600">历史语义摘要</text><text x="147" y="478" font-size="17" fill="#62748A" font-weight="400">模型生成 · 校验后写入检查点</text><path d="M440 473 L498 473" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="421" width="218" height="106" rx="10" fill="#ECF7F3" stroke="#C4E4DB"/><text x="544" y="459" font-size="20" fill="#168579" font-weight="600">摘要 + 未压缩尾部</text><text x="544" y="495" font-size="17" fill="#62748A" font-weight="400">覆盖已完成的历史前缀</text><path d="M760 473 L810 473" fill="none" stroke="#3269D6" stroke-width="3" marker-end="url(#arrow)"/><text x="839" y="458" font-size="22" fill="#172B42" font-weight="600">控制长期历史增长</text><text x="839" y="492" font-size="17" fill="#62748A" font-weight="400">让当前任务继续执行</text><rect x="64" y="582" width="1072" height="54" rx="10" fill="#EAF0F6" stroke="#EAF0F6"/><text x="88" y="617" font-size="19" fill="#172B42" font-weight="700">共同原则</text><text x="208" y="617" font-size="20" fill="#172B42" font-weight="400">只改变模型读取视图，原始消息与工具结果继续保存在 Runtime 事件库。</text><path d="M64 664 H1136" stroke="#D8E1EA"/><text x="64" y="694" font-size="15" fill="#62748A" font-weight="400">Pico Harness · 上下文压缩技术详解</text><text x="996" y="694" font-size="15" fill="#62748A" font-weight="400">技术原理图</text></g></svg>